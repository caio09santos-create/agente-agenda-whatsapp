spring:
  datasource:
    url: jdbc:h2:file:./data/agenteagenda
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080

# Segredos vêm de variáveis de ambiente. Nunca coloque valores reais aqui.
app:
  timezone: America/Fortaleza
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    owner-phone: ${WHATSAPP_OWNER_PHONE:}
    api-version: v23.0
    reminder-template: ${WHATSAPP_REMINDER_TEMPLATE:}
    template-language: pt_BR
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
  google:
    credentials-path: ${GOOGLE_CREDENTIALS_PATH:./credentials.json}
    tokens-dir: ./tokens
    calendar-id: primary
    oauth-port: 8888
  reminder:
    hour: 7
